<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Ayinkx</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0D1117" />
  <link rel="icon" type="image/png" href="https://github.com/Ayinkx.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
    })();
  </script>
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>
  <main class="notfound">
    <div class="notfound__code">404</div>
    <h1>This page wandered off 🎧</h1>
    <p>The link is broken or the page moved. Let’s get you back on track.</p>
    <div class="notfound__actions">
      <a class="btn btn--primary" href="/"><i class="fa-solid fa-house"></i> Back home</a>
      <a class="btn btn--outline" href="/#projects"><i class="fa-solid fa-diagram-project"></i> See projects</a>
    </div>
  </main>
</body>
</html>
